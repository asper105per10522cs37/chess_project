<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Chess App</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c3e50;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .controls {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .btn {
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #27ae60;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #219150;
        }

        /* --- Left to Right Loading Bar --- */
        .progress-container {
            width: 480px; /* Chess board size */
            height: 6px;
            background-color: #34495e;
            border-radius: 3px;
            overflow: hidden;
            visibility: hidden; /* Default hidden */
        }

        .progress-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #27ae60, #2ecc71, #27ae60);
            transform: translateX(-100%);
        }

        /* Animation class added via JS */
        .progress-container.loading .progress-bar {
            animation: moveRight 1.2s infinite ease-in-out;
        }

        @keyframes moveRight {
            0% {
                transform: translateX(-100%);
            }
            50% {
                transform: translateX(0%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        /* Chess Board Container */
        #board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 4px solid #34495e;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            opacity: 0.4;
            pointer-events: none;
        }

        #board.active {
            opacity: 1;
            pointer-events: auto;
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: pointer;
            user-select: none;
        }

        .light { background-color: #f0d9b5; }
        .dark { background-color: #b58863; }
        .selected { background-color: #7b61ff !important; }
        .piece { pointer-events: none; }
    </style>
</head>
<body>

    <div class="controls">
        <button id="start-btn" class="btn" onclick="startGame()">Start Game</button>
        
        <!-- Left to Right Progress Bar Container -->
        <div id="loading-bar" class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <div class="board-container">
        <div id="board"></div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
